[project]
name = "weatherml"
version = "0.1.0"
description = "Production weather ingestion, feature engineering, and short-term temperature forecasting pipeline"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "mlflow>=2.17",
    "matplotlib>=3.9",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-fastapi-instrumentator>=7.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "requests-mock>=1.12",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "httpx>=0.27",
]
dashboard = [
    "dash>=4.4.1",
    "dash-ag-grid>=35.3.0",
    "dash-mantine-components>=2.8.0",
    "plotly>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection requires calling Depends()/Query() in
# argument defaults - that's the framework's documented pattern, not a bug.
"src/weatherml/api/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests requiring a live MLflow/docker-compose stack",
]
pythonpath = ["src"]
